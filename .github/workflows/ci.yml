name: CI

on:
  push:
  pull_request:

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the whole history is what gets published
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  licences:
    name: Dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: pip install -r backend/requirements.txt pip-licenses

      # Fails on GPL, AGPL and SSPL — which reads oddly for an AGPL project,
      # so: VitaCore is dual-licensed (see LICENSING.md), and we cannot
      # relicense somebody else's copyleft code under the commercial half. One
      # such dependency would quietly end the second licence, and nobody would
      # notice until a customer asked for it.
      #
      # LGPL is allowed and only reported. It exists to permit exactly this —
      # a differently-licensed program using an unmodified library — and
      # Next.js reaches libvips through sharp for image handling. If we ever
      # vendor and *modify* an LGPL library, that changes, and this comment is
      # where to start.
      - name: Fail on copyleft Python dependencies
        run: |
          pip-licenses --format=csv --with-urls > licences-python.csv
          if grep -Ein '(^|[,"[:space:]([])(A?GPL|SSPL)[-0-9v ]|GNU (Affero )?General Public' licences-python.csv; then
            echo "::error::GPL/AGPL/SSPL Python dependency. Cannot be shipped under the commercial licence — see LICENSING.md."
            exit 1
          fi

      - name: Fail on copyleft Node dependencies
        working-directory: frontend
        run: |
          npm ci
          npx --yes license-checker-rseidelsohn \
            --production --csv --out ../licences-node.csv
          cd ..
          if grep -Ein '(^|[,"[:space:]([])(A?GPL|SSPL)[-0-9v ]|GNU (Affero )?General Public' licences-node.csv; then
            echo "::error::GPL/AGPL/SSPL Node dependency. Cannot be shipped under the commercial licence — see LICENSING.md."
            exit 1
          fi

      - name: Report LGPL dependencies
        run: |
          # Not a failure — a standing note of what has to stay unmodified
          # and dynamically linked for both licences to hold.
          grep -Ehi 'LGPL' licences-*.csv || echo "None."
      - uses: actions/upload-artifact@v4
        with:
          name: licences
          path: licences-*.csv

  tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms
          POSTGRES_DB: hms_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgres://hms:hms@localhost:5432/hms_test
      DJANGO_SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint
        # Defect rules, not style rules — see pyproject.toml. Fails the build
        # rather than printing warnings nobody reads, which is how the frontend
        # has been gated since Phase 1.
        run: ruff check .
      - name: No missing migrations
        run: python backend/manage.py makemigrations --check --dry-run
      - run: pytest
      - name: Audit chain verifies
        run: python backend/manage.py migrate && python backend/manage.py verify_audit_chain
      - name: No security warnings under production settings
        # X_FRAME_OPTIONS was set for two phases with the middleware that sends
        # it missing, so the header was never sent. Checked so that cannot
        # happen again.
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-key-long-enough-to-satisfy-the-check-000000
          SECURE_HSTS_PRELOAD: "True"
        run: python backend/manage.py check --deploy --fail-level WARNING

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Accessibility and keyboard rules
        # AC-53 and AC-54 are acceptance criteria, so these fail the build
        # rather than printing warnings nobody reads.
        run: npm run lint
      - name: Tests
        run: npm test
      - name: No keyboard-unreachable interactions
        # jsx-a11y does not flag a click handler on a table row, and one had
        # slipped in. Checked directly so it cannot come back.
        run: |
          if grep -rniE '<(div|span|li|tr|td|p)[^>]*onClick' src --include='*.tsx'; then
            echo "::error::Click handler on a non-interactive element — unreachable by keyboard."
            exit 1
          fi
      - name: Build
        run: npm run build
